name: release

on:
  push:
    tags:
      - "v*"
  # 手动触发 = 演练：打 exe，但只把 exe 存成附件，不建 Release
  # 发版仓不带测试：测试在开发仓发版前按这台机器的条件跑过（tools/preflight_release.py）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: 取源码
        uses: actions/checkout@v7

      - name: 装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 装 Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pystray pywebview

      - name: 重算第三方许可清单
        # 打包机装的包和开发机不一定一样，build_exe.ps1 会先核对清单是不是最新；
        # 清单里有自带 Node / Pi 的版本，得先把 build/runtime 备好再算，不然和打包时核对的对不上
        run: |
          python packaging/runtime.py build/runtime
          python packaging/licenses.py
          python packaging/licenses.py --check

      - name: 打 exe
        shell: pwsh
        run: ./packaging/build_exe.ps1

      - name: 算 sha256、挑发布说明
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "dist 里没有 exe" }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$sha  $($exe.Name)" | Out-File -Encoding ascii "dist/$($exe.Name).sha256"
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $notes = "docs/release-$ver.md"
          if (-not (Test-Path $notes)) {
            $notes = (Get-ChildItem docs -Filter "release-*.md" | Sort-Object Name | Select-Object -Last 1).FullName
          }
          if (-not $notes) { throw "docs 里没有发布说明" }
          Copy-Item $notes dist/release-notes.md

      - name: 建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release-notes.md
          files: |
            dist/*.exe
            dist/*.sha256
            dist/release-notes.md

      - name: 演练：把 exe 存成附件
        # 先在发版仓 main 上手动跑一次演练，过了再推标签
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: agentboxbox-dry-run
          path: |
            dist/*.exe
            dist/*.sha256
