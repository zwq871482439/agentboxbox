<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫猫盒子，办公室视图</title>
<!-- 骨架：样式 / 结构 / 脚本由 build.py 按固定顺序从 src/ 和 art/ 拼进来，要改画面改 src/ 下的源文件 -->
<style>
:root{--bg:#15151e;--bg2:#1c1c27;--line:#2a2a37;--red:#e10600;--txt:#f4f4f6;--dim:#8d8d9b;--dim2:#5c5c6b;
 --run:#3ddc84;--arch:#f5b301;--you:#ff4d4f;--idle:#8d8d9b;--off:#5c5c6b}
*{box-sizing:border-box}
body{
 margin:0;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Noto Serif CJK SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);
 font-size:13.5px
}

.top{border-top:3px solid var(--red);display:flex;align-items:baseline;gap:26px;padding:12px 18px;border-bottom:1px solid var(--line)}
.top b.brand{font-size:17px;letter-spacing:.2px}
.mt .k{color:var(--dim);font-size:12px;margin-right:6px}
.mt .v{font-size:19px;font-weight:700}
.mt small{color:var(--dim);font-size:12px;font-weight:400;margin-left:2px}

.wrap{padding:14px 18px;max-width:1040px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ph h3{margin:0;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.seg button{background:transparent;color:var(--dim);border:0;padding:3px 12px;font:inherit;font-size:12px;cursor:pointer}
.seg button.on{background:#2a2a37;color:var(--txt)}
.mt.theme{display:inline-flex;align-items:center;gap:8px}.mt.theme .seg{margin-left:0}.mt.theme .k{margin:0}
.stage{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg2)}
#cv{display:block;width:100%;cursor:default}
.demo{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;color:var(--dim);font-size:12px}
.demo button,.demo select{
 background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;
}

.demo button.primary{border-color:var(--red);color:#fff;background:#3a1416}
.drawer{
 position:absolute;top:0;right:0;bottom:0;width:300px;background:var(--bg2);border-left:1px solid var(--line);transform:translateX(102%);
 transition:transform .22s easepadding:14px 16px;overflow:auto;box-shadow:-12px 0 24px rgba(0,0,0,.35);
}

.drawer.open{transform:none}
.drawer h4{margin:0 0 2px;font-size:15px}
.drawer .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer}

.drawer .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.drawer dl{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:0;font-size:12.5px}
.drawer dt{color:var(--dim)}.drawer dd{margin:0;word-break:break-all}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:9px;border:1px solid currentColor}
.bar{height:6px;background:#2a2a37;border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
.list table{width:100%;border-collapse:collapse}.list td{padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
.list td.n{font-weight:700;white-space:nowrap}.list td.t{color:var(--dim)}
.foot{color:var(--dim2);font-size:11.5px;margin-top:6px}
/* 提醒条只放第 1 级「要你处理」：左上角贴着最上沿，一条一行（长了省略）、最多 3 行，宽不超过画布约三成，字和「自动 / 白天 / 夜晚」按钮一样大；像素风：方角 + 硬阴影 */
.alertbar{
 position:absolute;top:4px;left:1%;max-width:29%;z-index:6;background:#fffdf7;color:#2b2233;border:2px solid #2b2233;border-radius:0;
 box-shadow:3px 3px 0 rgba(0,0,0,.45)padding:4px 8px;font-size:12.5px;line-height:1.55;
}

.alertbar .al{display:block}
.alertbar .al .al-t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alertbar .al+.al{margin-top:5px;border-top:1px dashed #c9bfa8;padding-top:4px}
.alertbar .al b{color:#e10600;margin-right:4px}
.alertbar .al button{
 background:#fffdf7;color:#2b2233;border:2px solid #2b2233;border-radius:0;box-shadow:2px 2px 0 rgba(0,0,0,.35);padding:0 8px;font:inherit;cursor:pointer;
 margin-top:2px
}

.alertbar .al button:hover{background:#fde68a}
.alertbar .more{color:#6b5f4e}
/* 聚会街机：点街机弹的「聚会」菜单（会议室投影机旁的道具，见场景那一节）。
   样式照上岗像素窗口那套：米白底、深棕描边、硬阴影、方角；挂在 #stage 里跟着画布定位 */
.party-pop{
 position:absolute;z-index:7;min-width:128px;background:#fbf3e1;border:2px solid #2b1d12;box-shadow:3px 3px 0 rgba(0,0,0,.45);padding:3px;display:flex;
 flex-direction:column
}

.party-pop button{
 display:flex;align-items:center;gap:7px;background:transparent;border:0;border-radius:0;color:#2b1d12;padding:5px 12px 5px 6px;font:inherit;font-size:12.5px;
 cursor:pointertext-align:left;white-space:nowrap;
}

.party-pop button:hover{background:#f3e7c9}
.party-pop button[disabled]{opacity:.45;cursor:default}
.party-pop button[disabled]:hover{background:transparent}
.party-pop canvas{width:16px;height:16px;image-rendering:pixelated;flex:none}
/* 昼夜开关点开的五档菜单（自动 / 清晨 / 白天 / 傍晚 / 夜晚）：样式照聚会菜单那套，挂在 #stage 里跟着画布定位 */
.theme-pop{
 position:absolute;z-index:7;min-width:116px;background:#fbf3e1;border:2px solid #2b1d12;box-shadow:3px 3px 0 rgba(0,0,0,.45);padding:3px;display:flex;
 flex-direction:column
}

.theme-pop button{
 display:flex;align-items:center;gap:7px;background:transparent;border:0;border-radius:0;color:#2b1d12;padding:4px 12px 4px 6px;font:inherit;font-size:12.5px;
 cursor:pointertext-align:left;white-space:nowrap;
}

.theme-pop button:hover{background:#f3e7c9}
.theme-pop button.on{background:#e8e3d6;font-weight:600}
.theme-pop canvas{width:14px;height:14px;image-rendering:pixelated;flex:none}
[hidden]{display:none!important}   /* 自带 display:flex 的元素（聚会菜单等）也要听 hidden：不写这条，菜单一打开页面就是展开的 */
.drawer-alert{
 border:2px solid #2b2233;background:#fffdf7;color:#2b2233;box-shadow:3px 3px 0 rgba(0,0,0,.45);padding:6px 9px;font-size:12.5px;margin-bottom:10px;
 line-height:1.6
}

.drawer-alert b{color:#e10600}
.drawer-alert button{
 background:#fffdf7;color:#2b2233;border:2px solid #2b2233;border-radius:0;box-shadow:2px 2px 0 rgba(0,0,0,.35);padding:0 8px;font:inherit;font-size:12px;
 cursor:pointermargin-left:6px;
}

.drawer-alert button:hover{background:#fde68a}

</style></head><body>
<div class="top"><b class="brand" data-t="top.brand">猫猫盒子</b>
 <span class="mt"><span class="k" data-t="top.calls">今日调用</span><span class="v" id="m-calls">–</span></span>
 <span class="mt"><span class="k" data-t="top.okRate">成功率</span><span class="v" id="m-ok">–</span></span>
 <span class="mt"><span class="k" data-t="top.running">进行中</span><span class="v" id="m-run">–</span></span>
 <span class="mt" id="mt-you" hidden>
  <span class="k" style="color:var(--you)" data-t="top.youDecide">需要用户决策</span>
  <span class="v" id="m-you" style="color:var(--you)">1</span></span>
 <span class="mt theme"><span class="seg" id="theme-seg" data-t-title="top.themeTitle"
  title="自动：跟本机时间走（时间点在设置页改）；白天 / 夜晚：固定住，存在本机">
<button data-m="auto" class="on" data-t="theme.auto">自动</button>
<button data-m="dawn" data-t="theme.dawn">清晨</button>
<button data-m="day" data-t="theme.day">白天</button>
<button data-m="dusk" data-t="theme.dusk">傍晚</button>
<button data-m="night" data-t="theme.night">夜晚</button></span>
<span class="k" id="theme-label">–</span></span>
</div>
<div class="wrap">
 <div class="ph"><h3 data-t="top.channel">模型通道</h3>
  <span class="dim" id="src-note" style="color:var(--dim2);font-size:12px"></span>
  <div class="seg"><button data-v="list" data-t="top.list">列表</button>
<button data-v="office" class="on" data-t="top.office">办公室</button></div></div>
 <div class="stage" id="stage">
  <canvas id="cv" width="1280" height="800"></canvas>
  <div class="alertbar" id="alertbar" hidden></div>
  <div class="party-pop" id="party-pop" hidden></div>
  <div class="theme-pop" id="theme-pop" hidden></div>
  <div class="list" id="list" hidden></div>
  <style>.todo-it{border-top:1px solid #333;padding:6px 0}.todo-it a{color:#9bd4ff}</style><aside class="drawer" id="drawer">
<button class="x" id="dx">×</button><div id="dbody"></div></aside>
 </div>
 <div class="demo" id="demo"><span data-t="demo.label">演示：</span>
  <button class="primary" id="b-disp" data-t="demo.assign">模拟派活</button>
<button id="b-done" data-t="demo.done">模拟完成</button>
<button id="b-you" data-t="demo.youDecide">首领要决策</button>
<button id="b-off" data-t="demo.offline">切换离线</button>
  <span data-t="demo.channels">通道数</span>
<select id="s-n"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option>
<option>7</option><option>8</option></select>
  <span data-t="demo.skin">皮肤</span><select id="s-skin"></select>
 </div>
 <div class="foot" data-t="top.foot">点猫看详情。猫猫是原创像素画。</div>
</div>

function catPose(ch,t){
  const a=ch.act, fps=n=>Math.floor(t*n);
  const joy=(t%4.2)<.7;
  if(ch.moving)return{p:"walk",f:fps(ch.hurry?12:7)%4};
  if(a==="stand")return{p:"stand",f:0};   /* 站着（开会站位 / 场景围观 / 站会）：站直，不坐 */
  if(a==="meow")return{p:"yay",f:fps(6)%2};
  if(ch.state==="you")return{p:"you",f:fps(3)%2};
  if(ch.state==="fail")return{p:"fail",f:fps(3)%2};
  switch(a){
    case"type":return{p:"type",f:fps(8)%2};
    case"deskplay":{const sc=ch.playScene;if(sc==="video")return{p:"tea",f:(t%5)<1.2?1:0};if(sc==="blocks")return{p:"type",f:fps(5)%2,e:joy?"joy":null};
      return{p:"game",f:fps(5)%2,e:joy?"joy":null}}
    case"sleepbox":return{p:"nap",f:0};
    case"teabox":case"tea":return{p:"tea",f:(t%4)<1.3?1:0};
    case"phone":return{p:"phone",f:(t%3.4)<.6?1:0};
    case"stretch":return{p:"stretch",f:ch.actT<.6?0:ch.actT<2.6?1:ch.actT<3.2?2:0};
    case"wait":return{p:"wait",f:0};
    case"fridge":return{p:"phone",f:(t%2.6)<.5?1:0};
    case"sofanap":return{p:"nap",f:0};
    case"sofaphone":return{p:"phone",f:(t%3.4)<.6?1:0};
    case"sofachat":case"cards":return{p:(t%3)<.8?"yay":"sit",f:fps(4)%2};
    case"brew":return{p:"wait",f:0};
    case"fridgeopen":return{p:"yay",f:0};
    case"drink":return{p:"tea",f:(t%4)<1.3?1:0};
    case"eat":return{p:"tea",f:(t%1.2)<.5?1:0};
    case"chat":return{p:(t%3)<.8?"yay":"sit",f:fps(4)%2};
    case"boss_idle":return ch.bossAnim==="nap"?{p:"nap",f:0}:ch.bossAnim==="game"?{p:"game",f:(t%2.6)<.5?1:0}:ch.bossAnim==="tea"?{p:"tea",
      f:(t%4)<1.3?1:0}:ch.bossAnim==="phone"?{p:"phone",f:(t%3.4)<.6?1:0}:{p:"sit",f:0};
  }
  return{p:"sit",f:0};
}

  const acts=SKIN.idleActs;let tot=acts.reduce((s,a)=>s+a.w,0),r=Math.random()*tot,A=acts[0];for(const a of acts){if((r-=a.w)<=0){A=a;break}}
  ch.actT=0;ch.actDur=A.a==="stretch"?3.4:rnd(5,9);ch.goal=null;
  if(A.where==="box"){ch.plan=A.a;wantHome(ch,A.a)}
  else{leaveBox(ch);ch.plan=A.a;
    if(A.where==="wander"){ch.act=A.a;let cur=[ch.x,ch.y];const pts=[];for(let i=0;i<3;i++){const q=randFloor();pts.push(...route(cur,q));cur=q}ch.path=pts;
      ch.moving=true;ch.hurry=false;ch.goal="wander"}
    else if(A.where==="spot"){const p=randFloor();goTo(ch,p[0],p[1]);ch.goal="spot";ch.after=A.a}
    else if(A.where==="tea"){goTo(ch,TEA.x-6+rnd(-1,1),TEA.y+15);ch.goal="spot";ch.after="tea"}
    else if(A.where==="rug"){goTo(ch,rnd(22,36),rnd(123,127));ch.goal="spot";ch.after=A.a}
    else{ch.act=A.a;ch.moving=false}}
}
function pickIdleZoned(ch,force){ /* 空闲：按种子在 茶水间（咖啡 / 冰箱）、沙发区、工位上摸鱼、伸懒腰、串门 里挑一件，同一时间片结果固定 */
  if(ch.plan&&ch.actDur>0)ACTLOG.push({id:ch.id,plan:ch.plan,held:ch.actT,dur:ch.actDur});if(ACTLOG.length>500)ACTLOG.shift();
  const slot=slotOf(), r=srand(ch.id+":"+slot+":"+(ch.pickN=(ch.pickN||0)+1));ch.slot=slot;ch.actT=0;ch.goal=null;
  const idle=Object.values(CH).filter(c=>!c.st.lead&&c.state==="idle").map(c=>c.id).sort();
  /* 融合：加回原型的 溜达 wander、地毯刷手机 rugphone；工位喝茶 / 茶几喝茶 v2 并入咖啡机连锁 */
  /* v2：喝茶/咖啡都从咖啡机起步（不再有凭空的工位喝茶）；零食从冰箱起步；没开会时会议室可以摸鱼，2 只以上空闲可以打牌 */
  const meetFree=!(MEET&&MEET.until>T)&&!SCENE;   /* 会议室演着场景（看电影 / 打比赛 / 站会）时也不去会议室摸鱼 / 打牌 */
  const acts=[["coffee",3],["fridge",2],["sofa",3],["deskplay",2],["sleepbox",1.5],["stretch",1],["wander",1.5],["rugphone",1.2]];
  if(meetFree)acts.push(["meetslack",1]);
  if(idle.length>=2)acts.push(["visit",2.5]);
  if(idle.length>=2&&meetFree)acts.push(["cards",2]);
  let tot=acts.reduce((a,x)=>a+x[1],0),v=r()*tot,A=acts[0][0];for(const [a,w] of acts){if((v-=w)<=0){A=a;break}}
  if(force)A=force;
  /* 电脑上玩是长活动 12–18 秒；其他空闲小动作 5–8 秒。时长从「到地方」开始算（moveStep 到达时 actT 归零），路上不算 */
  ch.actDur=A==="deskplay"?12+r()*6:5+r()*3;
  if(A==="teabox"||A==="tabletea"||A==="tea")A="coffee";
  if(A==="coffee"&&ch.cup>0){ch.cup--;ch.actDur=3+r()*2;ch.plan="sip";wantHome(ch,"drink");return}   /* 杯里还有：坐回工位喝一口 */
  ch.plan=A;
  if(A==="deskplay")ch.playScene=["shooter","snake","blocks"][Math.floor(r()*3)];   /* 和原型一样：工位电脑上玩射击 / 贪吃蛇 / 方块 */
  if(A==="deskplay"||A==="sleepbox"){wantHome(ch,A);return}
  if(A==="stretch"){wantHome(ch,"sit");ch.after2="stretch";return}
  leaveBox(ch);
  if(A==="visit"){const mates=idle.filter(x=>x!==ch.id),m=CH[mates[Math.floor(r()*mates.length)]];if(m){goTo(ch,m.st.x+(m.st.x<ch.st.x?30:-24),m.st.y+9);
    ch.goal="spot";ch.after="chat";ch.mate=m.id;return}}
  if(A==="wander"){startWander(ch);return}
  if(A==="coffee"){const [x,y]=SPOTS.brew[0];goTo(ch,x+(hash(ch.id)%2)*6,y);ch.goal="spot";ch.after="brew";ch.faceTo=26;return}
  if(A==="fridge"){const [x,y]=SPOTS.fridgeopen[0];goTo(ch,x,y);ch.goal="spot";ch.after="fridgeopen";return}
  if(A==="cards"||A==="meetslack"){const seat=MEET_SEATS[(idle.indexOf(ch.id)+(A==="meetslack"?4:0))%MEET_SEATS.length];goTo(ch,seat[0],seat[1]);ch.goal="spot";
    ch.after=A==="cards"?"cards":"phone";return}
    const L=A==="coffee"?SPOTS.coffee:A==="fridge"?SPOTS.fridge:A==="rugphone"?SPOTS.rug:A==="tabletea"?SPOTS.table:SPOTS.sofa,
   i=(hash(ch.id)+Math.floor(r()*L.length))%L.length;
  goTo(ch,L[i][0],L[i][1]);ch.goal="spot";ch.after=A==="coffee"||A==="tabletea"?"tea":A==="fridge"?"fridge":A==="rugphone"?"phone":"sofanap";
}
/* v2 茶水间连锁：咖啡 = 走到咖啡机 → 煮 4 秒 → 端杯回工位 → 坐着喝；零食 = 走到冰箱 → 开门拿 2.5 秒 → 拿着回工位或去沙发 → 吃
   沙发：一只猫=躺下（睡 Zzz 或刷手机）；两只以上=聊天（♪）。开会优先：会议室打牌 / 摸鱼的猫散场 */
const BREW_S=4, FRIDGE_S=2.5;
function chainStep(ch){
  if(ch.act==="brew"&&ch.actT>BREW_S){ch.hold="cup";ch.cupNext=3+Math.floor(srand(ch.id+":cup:"+ch.t)()*6);wantHome(ch,"drink")}   /* 一杯 3–8 口 */
  else if(ch.act==="fridgeopen"&&ch.actT>FRIDGE_S){ch.hold="snack";if(srand(ch.id+"eat"+ch.slot)()<.5)wantHome(ch,"eat");else{const L=SPOTS.sofa,
    i=hash(ch.id)%L.length;goTo(ch,L[i][0],L[i][1]);ch.goal="spot";ch.after="eat"}}
  else if((ch.act==="drink"||ch.act==="eat")&&!ch.moving){if(ch.act==="drink"&&ch.hold==="cup"){ch.cup=Math.max(0,(ch.cupNext||5)-1);ch.cupT=0}ch.hold=null}
  if(ch.plan==="sofa"&&!ch.inBox&&(ch.act==="sofanap"||ch.act==="sofaphone"||ch.act==="sofachat")){
    const mates=Object.values(CH).filter(c=>c!==ch&&c.state==="idle"&&c.plan==="sofa"&&!c.moving&&!c.inBox).length;
    ch.act=mates?"sofachat":(ch.sofaPref||(srand(ch.id+"sofa"+ch.slot)()<.6?"sofanap":"sofaphone"))}
  if((ch.plan==="cards"||ch.plan==="meetslack")&&((MEET&&MEET.until>T)||SCENE)&&!inMeeting(ch)){ch.plan=null;ch.actDur=0}   /* 开会 / 演场景优先 */
  if(ch.plan==="cards"&&!ch.moving&&ch.act==="cards"&&Object.values(CH).filter(c=>c.plan==="cards"&&c.state==="idle").length<2)ch.act="phone"}
function cardsOn(){return Object.values(CH).filter(c=>c.act==="cards"&&!c.moving).length>=2}
function startWander(ch){ch.act="wander";let cur=[ch.x,ch.y];const pts=[];for(let i=0;i<3;i++){const q=randFloor();pts.push(...route(cur,q));cur=q}ch.path=pts;
  ch.moving=true;ch.hurry=false;ch.goal="wander"}
function randFloor(){for(let i=0;i<60;i++){const x=rnd(ZONE.desk.x+8,ZONE.desk.x+ZONE.desk.w-8),y=rnd(140,262);if(!blocked(x,
  y)&&!STATIONS.some(s=>Math.abs(s.x+12-x)<34&&y>s.y-6&&y<s.y+20))return[x,y]}return[40,140]}
function moveStep(ch,dt){
  if(ch.moving&&ch.path.length){const [tx,ty]=ch.path[0],sp=(ch.hurry?64:ch.act==="roll"?30:20)*dt,dx=tx-ch.x,dy=ty-ch.y,d=Math.hypot(dx,dy);
    if(Math.abs(dx)>.5)ch.face=dx>0?1:-1;
    if(d<=sp){ch.x=tx;ch.y=ty;ch.path.shift();if(!ch.path.length){ch.moving=false;if(!(ch.plan==="wander"&&ch.goal==="wander"))ch.actT=0;
        if(ch.goal==="home"){homeIn(ch);ch.act=ch.after;if(ch.after==="type"){ch.meowT=0}}
        else if(ch.goal==="wait"){ch.act="wait";ch.face=ch.x<BOSS.x?1:-1}
        else if(ch.goal==="gather"){ch.act="wait";ch.face=ch.x<BOSS.x?1:-1}   /* 围到首领旁边：面向它站着冒 ? */
        else if(ch.goal==="spot"){ch.act=ch.after;if(ch.faceTo!=null){ch.face=ch.faceTo>ch.x?1:-1;
          ch.faceTo=null}if(ch.after==="chat"&&CH[ch.mate])ch.face=CH[ch.mate].st.x>ch.x?1:-1}
        else if(ch.goal==="rest"){ch.act="sofanap";ch.plan="sofa"}   /* 歇着：到了沙发就窝着 */
        else if(ch.goal==="deliver"){ch.carry=false;ch.deliver=false;PUFFS.push({x:ch.x,y:ch.y-20,t:0,star:true});startMeeting(ch.id,"review");ch.goal=null;
          ch.act="sit"}
        else if(ch.goal==="meet"){ch.act=ch.meetStand?"stand":"sit";ch.face=ch.x<422?1:-1}
        else if(ch.goal==="wander"){ch.act="idle";if(SKIN.zoned&&ch.plan==="wander"&&ch.state==="idle"){ch.wanderRest=rnd(1,2.5)}else ch.actDur=rnd(1,2.5)}}}
    else{ch.x+=dx/d*sp;ch.y+=dy/d*sp}}
}
function stepChar(ch,dt){
  ch.t+=dt;ch.actT+=dt;if(ch.cup>0)ch.cupT=(ch.cupT||0)+dt;if(ch.toss)ch.toss=Math.max(0,ch.toss-dt);
  const c=ch.data, st=ch.state, lead=ch.st.lead;
  // 屏幕内容
  ch.screen=st==="off"?"off":st==="run"?ch.workScene:st==="you"?"alert":st==="fail"?"alert":(lead&&ch.act==="boss_idle"&&ch.bossAnim==="game")
  ?(ch.playScene||"shooter"):st==="arch"?"wait":
  /* arch 态玩电脑也要显示游戏画面 */
    (ch.inBox&&ch.act==="deskplay")?ch.playScene:(ch.inBox&&ch.act==="sleepbox")
    ?"sleep":lead?(ch.bossAnim==="nap"?"sleep":ch.bossAnim==="game"?(ch.playScene||"shooter"):"video"):ch.inBox?"video":"sleep";
  if(!ch.inBox&&st!=="run"&&st!=="off")ch.screen=st==="arch"?"wait":"sleep";
  if(ch.spawnHide)return;   /* 等快递箱的猫不占工位，不活动、不摸鱼 */
  if(ch.wakeT>0){ /* 刚从午睡醒来：先伸个懒腰，伸完该干嘛干嘛（被派活的回工位干活） */
    ch.wakeT-=dt;ch.plan=null;ch.hold=null;ch.path=[];ch.moving=false;ch.act="stretch";
    if(ch.wakeT<=0){ch.wakeT=0;ch.act="idle";ch.actT=0;ch.actDur=0;ch.goal=null}
    return}
  if(napStep(ch,dt))return;   /* 午睡中的猫：这一帧全交给午睡（去沙发 / 趴工位 / 睡着不动） */
  if(partySeatFor(ch)){partyStep(ch,dt);return}   /* –庆祝 / 复盘：这只猫这帧归场景管 */
  if(meetSceneStep(ch,dt))return;   /* 会议室场景（看电影 / 打比赛 / 站会）里的猫：这一帧全交给场景 */
  if(lead&&SKIN.zoned&&ch.coffeeTrip&&!inMeeting(ch)){ // TeamLeader 自己去打咖啡
    if(!ch.moving)chainStep(ch);
    moveStep(ch,dt);
    if(ch.inBox&&!ch.moving&&ch.act==="drink"){chainStep(ch);ch.coffeeTrip=0;ch.act="boss_idle";ch.bossAnim="tea";ch.actT=0;ch.actDur=rnd(5,8)}
    return
  }
  if(lead&&inMeeting(ch)&&ch.coffeeTrip){ch.coffeeTrip=0;ch.hold=null}
  if(lead&&SKIN.zoned&&(inMeeting(ch)||!ch.inBox)){ // 开会：TeamLeader 也去会议室，开完回座位
    if(inMeeting(ch)){const [mx,my]=meetSeat(ch);if(ch.goal!=="meet"){leaveBox(ch);goTo(ch,mx,my,true);ch.goal="meet";ch.after="sit"}}
    /* 派活/验收：TeamLeader 小跑进会议室 */
    else if(ch.goal!=="home"){goTo(ch,ch.st.x,ch.st.y+7);ch.goal="home";ch.after="boss_idle"}
    moveStep(ch,dt);return
  }else if(lead){ // TeamLeader 平时坐在自己的大箱子里
    ch.inBox=true;ch.moving=false;
    if(st==="you")ch.act="you"; /* TeamLeader 不推断忙闲，只按老板节奏轮着休闲 */
    else{ch.act="boss_idle";if(ch.actT>ch.actDur){if(ch.actDur)ACTLOG.push({id:ch.id,plan:"boss_"+ch.bossAnim,held:ch.actT,dur:ch.actDur});ch.actT=0;
ch.bossAnim=["game","tea","phone","nap","game"][Math.floor(srand("boss:"+Date.now()+":"+ch.t)()*5)];ch.actDur=ch.bossAnim==="game"?rnd(12,18):rnd(5,8);
if(ch.bossAnim==="tea"){if(ch.cup>0)ch.cup--;else if(SKIN.zoned){const [bx,by]=SPOTS.brew[0];leaveBox(ch);goTo(ch,bx+6,by);ch.goal="spot";ch.after="brew";
      ch.faceTo=26;ch.coffeeTrip=1;return}}if(ch.bossAnim==="game")ch.playScene=["shooter","snake","blocks"][hash(ch.id+Math.floor(ch.t))%3]}}
    return}
  if(st==="off"){ch.inBox=true;ch.moving=false;ch.act="off";return}
  if(st==="rest"){ /* 歇着（额度用完 / 被限流 / 接口连不上 / 服务端出错）：去沙发那边歇着，头顶一个小钟 */
    if(ch.goal!=="rest"){leaveBox(ch);const L=SPOTS.sofa,i=hash(ch.id)%L.length;goTo(ch,L[i][0],L[i][1]);ch.goal="rest";ch.after="sofanap"}
    if(!ch.moving&&ch.act!=="sofanap")ch.act="sofanap";
    moveStep(ch,dt);return}
  if(ch.meowT>0){ch.meowT-=dt;ch.act="meow";if(!ch.inBox)ch.moving=false;if(ch.meowT>0)return}
  if(ch.seatT>0&&SKIN.zoned&&!lead&&st==="idle"&&!inMeeting(ch)&&!ch.deliver){ /* 收尾：刚开箱的猫先在工位坐满 20 秒，期间不抽摸鱼动作、不溜达（被派活 / 开会不受限） */
    ch.seatT=Math.max(0,ch.seatT-dt);ch.act="sit";ch.actT=0;ch.actDur=0;ch.plan=null;ch.hold=null;ch.goal=null;ch.path=[];ch.moving=false;return}
  if(SKIN.zoned&&inMeeting(ch)&&!lead){const [mx,my]=meetSeat(ch);if(ch.goal!=="meet"){leaveBox(ch);goTo(ch,mx,my,true);ch.goal="meet";
    ch.after=ch.meetStand?"stand":"sit"}}
  else if(SKIN.zoned&&ch.goal==="meet"){ch.goal=null;ch.deliver=false;wantHome(ch,st==="run"?"type":"sit")}
  else if(SKIN.zoned&&ch.deliver&&st==="idle"){ /* 交活：抱着文件进会议室，TeamLeader 一起验收 */
    if(ch.goal!=="deliver"){leaveBox(ch);ch.carry=true;const [mx,my]=MEET_SEATS[1];goTo(ch,mx,my,true);ch.goal="deliver";ch.after="sit"}}
  else if(st==="run"||st==="fail"||st==="appr"||st==="you"||st==="config"){wantHome(ch,st==="run"?"type":"sit",st==="run")}
  else if(st==="arch"){ /* 等待 / 卡住：坐在自己工位上冒省略号（不再跑去 TeamLeader 旁边站着） */
    if(SKIN.zoned)wantHome(ch,"sit");else{const slot=[[132,132],[234,132]][Object.values(CH).filter(x=>x.state==="arch"&&!x.st.lead).indexOf(ch)%2];
    if(ch.goal!=="wait"){leaveBox(ch);goTo(ch,slot[0],slot[1]);ch.goal="wait";ch.after="wait"}}}
  else if(st==="idle"&&SKIN.zoned&&DATA&&DATA.leader_quiet){ /* 首领没反应 → 空闲的猫围到它工位旁边冒 ?；首领有动静（leader_quiet 消失）自动散 */
    ch.plan=null;ch.hold=null;
    const mates=Object.values(CH).filter(c=>!c.st.lead&&c.state==="idle").map(c=>c.id).sort();
    const spot=GATHER_SPOTS[Math.max(0,mates.indexOf(ch.id))%GATHER_SPOTS.length];
    if(ch.goal!=="gather"){leaveBox(ch);goTo(ch,spot[0],spot[1]);ch.goal="gather";ch.after="wait"}}
  else{ // 空闲：随机摸鱼
    if(ch.goal==="wait"||ch.goal==="gather"||ch.goal==="home"&&ch.after==="type"){ch.goal=null;ch.actDur=0}
    if(SKIN.zoned){
      if((!ch.moving||ch.plan==="wander")&&(!ch.actDur||ch.actT>ch.actDur)&&!(ch.act==="brew"||ch.act==="fridgeopen"||ch.hold&&ch.moving))pickIdle(ch);
      else if(!ch.moving&&ch.plan==="wander"&&ch.wanderRest!=null&&(ch.wanderRest-=dt)<=0){ch.wanderRest=null;startWander(ch)}}
    else if(!ch.moving&&ch.actT>ch.actDur)pickIdle(ch)}
  if(st==="idle"&&SKIN.zoned&&!ch.moving)chainStep(ch);
  if(ch.after2==="stretch"&&ch.inBox){ch.after2=null;leaveBox(ch);ch.act="stretch";ch.actT=0}
  if(ch.act==="stretch"&&ch.actT>3.3&&!ch.moving){ch.act="idle"}
  moveStep(ch,dt);
}

/* ===================== =====================
   场景分两类：会议室场景（放电影 / 来一局 / 站会 / 庆祝…，画面第 2、3 张卡做）全场同一时间最多一个；
   不进会议室的场景（分头午睡 / 加班夜宵）按猫各自生效，可以和别的场景同时存在。
   有猫被派活（state 变成 run）就让它立刻退出场景回工位；派活会 / 验收会开始时会议室场景结束。
   每种场景记最近一次开始的时间（后面「1 小时内不重复」用）。 */
const SCENE_MEET=["movie","game","standup","celebrate","wrapup","postmortem"];   /* 会议室场景名单（画布 2/3 已加站会；第 3 张卡的庆祝 / 复盘再往里加） */
let SCENE=null;                        /* 当前会议室场景 {name,t0,ids:Set,hadIds,...}；没有就是 null */
let SCENE_LAST={};                     /* 每种场景最近一次开始的时间（Date.now 毫秒） */
const NAPS=new Map();                  /* 分头午睡：猫 id → {t0,where:"sofa"|"desk",spot} */
const SNACKS=new Set();                /* 加班夜宵：桌上有外卖盒的猫 id */
let NAP_FORCE=0;                       /* 测试钩子直接开演的午睡：睡到这个模拟时刻为止 */
let SNACK_PHASE=null;                  /* 上一帧的天色（夜里摆盒，第一次离开夜晚才收盒） */
function nowDate(){return new Date(Date.now())}   /* 场景用的钟：测试把 Date.now 钉住时它也跟着钉住 */
function napTime(d){ /* 午睡时段：本地时间 12:00–14:00（这个时段里不触发放电影 / 来一局） */
  d=d||nowDate();const m=d.getHours()*60+d.getMinutes();return m>=720&&m<840}
function sceneIsMeet(name){return SCENE_MEET.includes(name)}
function sceneStart(name,opts){ /* 开一个场景：会议室场景全场只能同时一个（先散掉现有场景；）；午睡 / 夜宵按猫各自生效 */
  opts=opts||{};SCENE_LAST[name]=Date.now();
  if(sceneIsMeet(name)){
    if(napTime()&&(name==="movie"||name==="game"))return SCENE;   /* 午睡时段不放电影 / 不来一局 */
    sceneEnd("switch");
    let ids=opts.ids;
    if(!ids){ /* 没点名：看电影 / 来一局把现在没活的猫（首领也算）都叫上；站会把被派的猫和首领叫上 */
      if(name==="standup"){const ws=Object.keys(CH).filter(id=>!(CH[id].st&&CH[id].st.lead)).sort();
        opts=Object.assign({},opts,{stations:ws});   /* 测试钩子直接开站会：拿现在的打工猫假装一批 */
        ids=ws.concat(Object.keys(CH).filter(id=>CH[id].st&&CH[id].st.lead))}
      else ids=name==="movie"?sceneMovieCats():sceneIdleCats()}   /* 看电影：没在干活的都去（含失败 / 等你处理）；来一局还是只有空闲的 */
    SCENE={name,t0:T,ids:new Set(ids),hadIds:!!ids.length};
    if(opts.stations)SCENE.stations=opts.stations.filter(id=>CH[id]&&!(CH[id].st&&CH[id].st.lead));   /* 站会散场顺序 */
    if(name==="standup")SCENE.dur=30+Math.floor(srand("standup:"+Math.round(T))()*31);   /* 站会开 30–60 秒 */
    if(name==="game")SCENE.players=[...SCENE.ids].filter(id=>!(CH[id].st&&CH[id].st.lead)).sort().slice(0,2);   /* 两只选手坐桌头两侧 */
    return SCENE}
  if(name==="nap")napStart(!!opts.force);
  else if(name==="snack")snackStart(!!opts.force);
  return null}
function sceneEnd(reason){ /* 会议室场景结束：参与的猫清掉目标回去各干各的（画面第 2 张卡接） */
  if(!SCENE)return;

}
function sceneDrop(id,why){ /* 一只猫退出场景（被派活回工位）：会议室名单里去掉，午睡的醒来 */

function sceneTick(){napTick();snackTick();meetSceneTick();partyTick()}

/* ---- 分头午睡（本地 12:00–14:00 没活的猫去睡。沙发最多 2 只（蜷着，现有沙发睡姿），多的趴自己工位；
   被派活就醒（伸个懒腰后回工位干活），到 14:00 全部醒来伸懒腰。首领也算没活的猫。 ---- */
function napIdle(ch){ /* 没活的猫（按猫单独判）：打工猫要空闲；首领没在干活 / 没等拍板就行 */
  const st=ch.state;
  if(SCENE&&PARTY.includes(SCENE.name)&&SCENE.ids.has(ch.id))return false;   /* –庆祝 / 复盘里的猫不睡 */
  if(st==="off"||st==="run"||st==="fail"||st==="you"||st==="config")return false;
  if(ch.pending||ch.deliver||inMeeting(ch))return false;
  if(ch.seatT>0)return false;   /* 收尾：刚开箱的猫先坐满 20 秒，场景（来一局 / 午睡）不拉它，免得一落地就被叫走 */
  return ch.st.lead||st==="idle"}
function napStart(force){ /* 开演：测试钩子可以直接开（不看钟）；自然触发只看钟 */
  if(force)NAP_FORCE=T+7200;

function napJoin(){ /* 把还没睡的没活猫排进午睡：沙发 2 个位按 id 排先到先得（稳定），多的趴工位 */
  const ids=Object.keys(CH).filter(id=>napIdle(CH[id])&&!NAPS.has(id)).sort();
  if(!NAPS.size&&ids.length)SCENE_LAST.nap=Date.now();
  let sofa=[...NAPS.values()].filter(n=>n.where==="sofa").length;
  for(const id of ids){
    let where="desk",spot=null;
    if(sofa<2){where="sofa";spot=SPOTS.sofa[sofa];sofa++}
    NAPS.set(id,{t0:T,where,spot})}}
function napWake(ch,why){ /* 醒来：伸个懒腰（现有 stretch 动作），伸完该干嘛干嘛 */
  if(!ch)return;NAPS.delete(ch.id);
  ch.plan=null;ch.hold=null;ch.path=[];ch.moving=false;
  if(ch.st.lead)ch.bossAnim="sit";
  ch.wakeT=3.2;ch.act="stretch";ch.actT=0}
function napTick(){ /* 每帧：进了时段把没活的猫排去睡；出了时段全醒；睡着以后有活的（被派活）单只醒 */
  if(napTime())NAP_FORCE=0;
  if(napTime()||T<NAP_FORCE)napJoin();
  else for(const id of[...NAPS.keys()]){const ch=CH[id];if(ch)napWake(ch,"time")}
  for(const id of[...NAPS.keys()]){const ch=CH[id];if(!ch||!napIdle(ch))napWake(ch,"work")}}
function napStep(ch,dt){ /* 午睡中的猫这一帧：去沙发 / 趴工位，睡着了就不动；要开会的先醒来 */
  const n=NAPS.get(ch.id);if(!n)return false;
  if(inMeeting(ch)){napWake(ch,"meet");return false}
  if(n.where==="desk"){ /* 趴自己工位：回箱子里睡（身体压低 + 头上 Zzz） */
    if(!ch.inBox){wantHome(ch,"sleepbox");moveStep(ch,dt);return true}
    ch.plan=null;ch.act="sleepbox";if(ch.st.lead)ch.bossAnim="nap";return true}
  if(ch.inBox)leaveBox(ch);
  if(ch.moving){moveStep(ch,dt);return true}
  if(Math.hypot(ch.x-n.spot[0],ch.y-n.spot[1])>2.5){goTo(ch,n.spot[0],n.spot[1]);moveStep(ch,dt);return true}
  ch.plan=null;ch.act="sofanap";if(ch.st.lead)ch.bossAnim="nap";return true}

/* ---- 加班夜宵（夜晚（跟昼夜切换的「夜」一致）在干活的猫，工位桌上摆一个外卖盒（一晚每只一次，记在本机）；
   盒子留到天亮（第一次离开夜晚）才收走；干活中偶尔冒「累」的气泡（actKind 里的 tired 图标）。 ---- */
function snackNightId(){ /* 一晚一个 id：中午 12 点以后算当天，凌晨算昨天那一晚 */
  const d=nowDate();if(d.getHours()<12)d.setDate(d.getDate()-1);
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function snackRec(){ /* 本机记的「这一晚已经摆过盒的猫」：刷新页面同一晚不重复出现 */
  try{const v=localStorage.getItem("bx-snack")||"",i=v.indexOf("|");
    return i<0?["",[]]:[v.slice(0,i),v.slice(i+1).split(",").filter(Boolean)]}catch(e){return["",[]]}}
function snackRecSave(nid,ids){try{localStorage.setItem("bx-snack",nid+"|"+ids.join(","))}catch(e){}}
function snackStart(force){ /* 开演：夜里在干活的猫桌上摆盒（force 是测试钩子，不看天色也不记本机） */
  if(force){ /* 认 feed 里的状态：刚被派活的猫可能还在午睡醒来的懒腰里，画布上的 state 晚一两秒才变 */
    const run=new Set((DATA&&DATA.channels||[]).filter(c=>c.state==="run").map(c=>c.id));
    for(const id in CH)if(CH[id].state==="run"||run.has(id))SNACKS.add(id);return}
  snackTick()}
function snackTick(){ /* 每帧：夜里给在干活的猫摆盒（每只一晚一次，第一次摆就记进本机，刷新不重复）；一离开夜晚收盒 */
  for(const id of[...SNACKS])if(!CH[id])SNACKS.delete(id);
  if(THEME.phase==="night"){
    const nid=snackNightId(),[rn,rids]=snackRec(),done=new Set(rn===nid?rids:[]);
    let added=false;
    for(const id in CH){const c=CH[id];
      if(c.state==="run"&&!SNACKS.has(id)&&!done.has(id)){SNACKS.add(id);done.add(id);added=true}}
    if(added){snackRecSave(nid,[...done]);SCENE_LAST.snack=Date.now()}}   /* 盒子留到白天才收，但记录当晚就写 */
  else if(SNACK_PHASE==="night")SNACKS.clear();   /* 盒子留到白天：第一次离开夜晚才收 */
  SNACK_PHASE=THEME.phase}
function snackOn(ch){return SNACKS.has(ch.id)&&THEME.phase==="night"&&ch.state==="run"}

/* ===================== 
   不写字，全用像素道具和气泡图标：看电影 = 灯调暗 + 幕布放抽象色块 + 桌上一桶爆米花 + 偶尔冒高兴；
   打比赛 = 投影左右两半各一个小游戏（颜色不同），两只选手坐离幕布最近那排座位对战，围观的站桌子两侧外面 / 桌下站位举「加油」小牌，一局结束赢的冒高兴、输的冒无语；
   站会 = 被派的猫和首领全站着（首领在幕布左下方、被派的猫在桌子左右两侧外面），首领一根指示棒指投影上的三列看板（。
   有猫被派活立刻起身回工位（框架 sceneDrop 会做）：看电影 / 围观的走了剩下的继续，选手走了当场散场，没人了收幕布。 */
function sceneIdleCats(){ /* 现在没活的猫（首领也算）：来一局把他们都叫进会议室 */
  return Object.keys(CH).filter(id=>napIdle(CH[id])&&!NAPS.has(id)).sort()}
function sceneMovieCats(){ /* 看电影的观众：首领 + 没在干活（不是「进行中」）的猫；失败 / 等你处理的本就在等人，也去看；下线的来不了 */
  return Object.keys(CH).filter(id=>{const c=CH[id];if(!c||c.state==="off"||c.state==="run")return false;
    if(c.pending||c.deliver||inMeeting(c))return false;if(c.seatT>0)return false;   /* 刚开箱坐满 20 秒的猫不拉（收尾，同 napIdle） */
    return!NAPS.has(id)}).sort()}
function meetSceneTick(){ /* 每帧：没场景时看自动触发；演着时看到点收 / 有人走 */
  if(!SCENE){meetSceneAuto();return}
  const el=T-SCENE.t0;
  if(SCENE.name==="movie"||SCENE.name==="game"){
    for(const id of[...SCENE.ids]){const c=CH[id];   /* 被派活 / 下线：退出场景（看电影时失败 / 等你处理的留下——它们本就在等人，不是在干活；打比赛照旧请走） */
      if(!c||c.state==="off"||c.state==="run"||(SCENE.name==="game"&&(c.state==="fail"||c.state==="you")))sceneDrop(id,"work")}
    if(!SCENE)return}
  if(SCENE.name==="movie"){if(el>=600)sceneEnd("ended");return}   /* 一场约 10 分钟 */
  if(SCENE.name==="game"){
    const pl=SCENE.players||[];
    if(pl.length&&pl.some(id=>!SCENE.ids.has(id))){sceneEnd("assign");return}   /* 选手被派活：当场结束 */
    if(SCENE.doneAt!=null){if(T-SCENE.doneAt>=4)sceneEnd("ended");return}
    const r=SCENE.round||1;
    if(el>=120*r){   /* 一局约 2 分钟；打完一局胜负随机：赢的冒高兴、输的冒无语；最多 3 局 */
      SCENE.winner=pl.length?pl[Math.floor(srand("gwin:"+Math.round(SCENE.t0)+":"+r)()*pl.length)]:null;
      SCENE.roundEnd=T;
      if(r>=3)SCENE.doneAt=T;else SCENE.round=r+1}
    return}
  if(SCENE.name==="standup"){
    const dur=SCENE.dur||40;
    if(el>=dur){   /* 开完了：按 stations 的顺序一只只回工位，间隔约 2 秒；走完了散场 */
      const all=SCENE.stations||[],n=Math.floor((el-dur)/2);
      for(let i=0;i<n&&i<all.length;i++){const id=all[i];if(!SCENE.ids.has(id))continue;SCENE.ids.delete(id);
        const ch=CH[id];if(ch){ch.goal=null;ch.plan=null;ch.hold=null;ch.actDur=0;ch.actT=0;wantHome(ch,ch.state==="run"?"type":"sit")}}
      if(![...SCENE.ids].some(id=>CH[id]&&!(CH[id].st&&CH[id].st.lead)))sceneEnd("ended")}
    return}
}
let GAME_SLOT=-1;   /* 来一局：每个空闲时间片只掷一次骰子 */
function meetSceneAuto(){ /* 自动触发：核心给了 scenes 才看（老 feed 没这个键就不触发）；手动点菜单 / 测试钩子不看这些条件 */
  if(!DATA||!DATA.scenes||!sceneBubblesOn())return;
  if(MEET&&MEET.until>T)return;   /* 正在开派活会 / 验收会 */
  if(napTime())return;            /* 午睡时段不放 */
  const idleW=Object.values(CH).filter(c=>!(c.st&&c.st.lead)&&c.state==="idle"&&!NAPS.has(c.id));
  const is0=DATA.scenes.idle_since,t0=is0?Date.parse(is0):NaN;   /* 放电影：白天（不是夜晚）、全员空闲满 20 分钟、1 小时内没放过 */
  if(THEME.phase!=="night"&&!isNaN(t0)&&Date.now()-t0>=20*60*1000&&Date.now()-(SCENE_LAST.movie||0)>=3600*1000&&idleW.length){sceneStart("movie");return}
  const slot=slotOf();   /* 来一局：至少 2 只打工猫同时空闲，每个空闲时间片 20% 概率，1 小时内不重复 */
  if(slot!==GAME_SLOT){GAME_SLOT=slot;
    if(idleW.length>=2&&Date.now()-(SCENE_LAST.game||0)>=3600*1000&&srand("game:"+slot)()<0.2)sceneStart("game")}
}
function standupStart(e){ /* 派活站会：被派的猫和首领站着围在会议桌前；正放着电影 / 打着比赛就先收场（sceneStart 会 sceneEnd） */
  const stations=(e.stations||[]).filter(id=>CH[id]&&!(CH[id].st&&CH[id].st.lead));
  if(!stations.length&&e.station&&CH[e.station]&&!(CH[e.station].st&&CH[e.station].st.lead))stations.push(e.station);
  const lead=Object.keys(CH).find(id=>CH[id].st&&CH[id].st.lead);
  const ids=stations.slice();if(lead)ids.push(lead);

function sceneSpot(ch){ /* 这只猫在会议室场景里的位置；站着还是坐着顺手记在 ch.sceneStand */
  const ids=[...SCENE.ids].sort(),lead=ch.st&&ch.st.lead;
  const workers=ids.filter(id=>CH[id]&&!(CH[id].st&&CH[id].st.lead));
  if(SCENE.name==="standup"){ch.sceneStand=true;   /* 站会全站着（不坐）：首领在幕布左下方（会议桌左上角外侧），被派的猫分站桌子左右两侧外面（先左后右交替，多了用桌下站位），两两身体矩形不相交、不压幕布 */
    if(lead)return[380,140];
    const spots=[[378,164],[466,140],[378,195],[466,164],[466,188],[398,201],[446,201]];
    return spots[Math.max(0,workers.indexOf(ch.id))%spots.length]}
  if(SCENE.name==="game"){
    const pi=(SCENE.players||[]).indexOf(ch.id);
    if(pi>=0){ch.sceneStand=false;return[[382,148],[462,148]][pi]}   /* 选手坐离幕布最近那排（桌子上端左右两个座位），面朝幕布对战 */
    ch.sceneStand=true;   /* 围观的：普通猫先站桌子左右两侧外面、再桌下站位；首领个子高，直接站桌下站位（举牌不挡选手） */
    const ws=ids.filter(id=>!(SCENE.players||[]).includes(id));
    if(lead)return MEET_STAND[ws.filter(id=>CH[id].st&&CH[id].st.lead).indexOf(ch.id)%MEET_STAND.length];
    const w=ws.filter(id=>!(CH[id].st&&CH[id].st.lead));
    const spots=[[376,180],[468,180],[446,201],[470,201]];
    return spots[Math.max(0,w.indexOf(ch.id))%spots.length]}
  /* 看电影：首领坐桌头，成员先坐两侧 4 座，坐不下站桌下站位（和开会一个规矩） */
  if(lead){ch.sceneStand=false;return MEET_HEAD}

function meetSceneStep(ch,dt){ /* 场景里的猫这一帧全交给场景：走到自己的位子坐下 / 站定就不动。返回 true = 这一帧已处理 */
  if(!SCENE||!SCENE.ids.has(ch.id))return false;
  if(inMeeting(ch))return false;   /* 真要开会了让出会议室（startMeeting 已经把场景收了，这里只是兜底） */

  if(Math.hypot(ch.x-spot[0],ch.y-spot[1])>2.5){if(!ch.moving||ch.goal!=="scene"){goTo(ch,spot[0],spot[1],true);ch.goal="scene"}moveStep(ch,dt);return true}
  if(ch.moving){moveStep(ch,dt);return true}
  ch.plan=null;ch.hold=null;ch.act=ch.sceneStand?"stand":"sit";ch.face=ch.x<422?1:-1;
  if(ch.st&&ch.st.lead)ch.bossAnim="sit";

  const ids=Object.keys(CH);
  if(ONBOARD&&ids.some(id=>CH[id].st&&!CH[id].st.lead&&!CH[id].spawnHide))ONBOARD=false;   /* 第一只打工猫坐下了：上岗流程结束，空位框回灰 */

function feedAnimDiff(prev,ids){

    if(fx&&fx.cat&&!slotBusy(ch.st.slot)){delete fx.cat;ch.spawnHide=false;seatNow(ch)}}   /* 真猫接上假猫的位置：同样先坐满 20 秒，别一露面就溜达 */
  for(const id of ids){const ch=CH[id];if(!ch.st||ch.st.lead||SEEN_IDS.has(id))continue;
    const slot=ch.st.slot;
    if(ch.data&&ch.data.pending_open)continue;   /* 第 6 条：刚招、还在开箱 → 这只猫的送箱动画归上岗流程管 */
    if(EXPLICIT_SLOT[slot]||slotBusy(slot)||(SLOT_FX[slot]&&(SLOT_FX[slot].box||SLOT_FX[slot].cat)))continue;   /* 上岗流程在管这个工位 */

    const slot=was.st.slot;

  stepAnims(dt);   /* 上岗动画（快递猫 / 箱子 / 假猫 / 王冠都归它推） */
  g.setTransform(LOK,0,0,LOK,0,0);g.imageSmoothingEnabled=false;g.clearRect(0,0,WW,WH);

  if(SKIN.zoned){drawShadows(T);drawLightFx(T)}   /* v2 光影只给猫猫箱皮肤；纸箱人（黑白皮肤）不画光影 */
  // 深度排序：工位 + 空位虚线框 + 在外面的角色 + 打印机 + 上岗动画的箱子 / 猫 / 快递猫
  const items=[];for(const st of STATIONS){const ch=CH[st.id];if(SKIN.zoned&&ch.spawnHide)continue;items.push({y:st.y,f:()=>SKIN.drawStation(st,CH[st.id],T)})}
  {const occ=new Set(STATIONS.filter(s=>!(SKIN.zoned&&CH[s.id]&&CH[s.id].spawnHide)).map(s=>s.slot));
    for(const s of SLOT_ORDER)if(!occ.has(s))items.push({y:SLOT_POS[s][1],f:()=>drawEmptySlot(s)})}
  for(const id in CH){const ch=CH[id];if(!ch.inBox&&ch.state!=="off"&&!ch.spawnHide)items.push({y:ch.y,f:()=>SKIN.drawOut(ch,T)})}
  items.push({y:PRINTER.y,f:()=>drawPrinter(T)});
  for(const s in SLOT_FX){const fx=SLOT_FX[s],pp=slotXY(s);
    if(fx.box)items.push({y:pp.y+.5,f:()=>drawFxBox(s)});
    if(fx.cat)items.push({y:fx.cat.y+.2,f:()=>drawFxCat(s)})}
  for(const a of ANIMS){if(a.couriers)items.push({y:a.y,f:()=>drawCourierGroup(a)});
    if(a.jcat)items.push({y:a.jcat.y,f:()=>drawJumpCat(a)})}
  for(const o of COURIER_OUT)items.push({y:o.y,f:()=>drawCourierGroup(o)})   /* done 之后还在走的快递猫 */
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());

  if(SKIN.zoned)drawSceneDim();   /* 看电影调暗灯：只盖地面和桌子，画在投影机之前，不压幕布和投影光 */
  if(SKIN.zoned)drawProjector(T);   /* 投影机 + 光锥：罩在猫身上，画在角色之后 */
  drawSceneFx(T);   /* 会议室场景道具：爆米花 / 加油小牌 / 指示棒（–画布 2/3） */
  for(const id in CH)drawHP(CH[id]);
  drawPuffs(dt);drawEnvelopes(dt);
  drawPartyFx(T);   /* –彩带 / 鼓掌的小手（世界层，画在猫上面） */
  drawCrownFx();   /* 落下的王冠 + 落稳一闪 */
  hi.setTransform(1,0,0,1,0,0);hi.imageSmoothingEnabled=false;hi.clearRect(0,0,cv.width,cv.height);hi.drawImage(lo,0,0,cv.width,cv.height);
  drawOverlay(T);
  if(SKIN.zoned)drawMeetBubbles(T);   /* 开会气泡（气泡 + 图标）画在最上层 */
  drawSceneBubbles(T);   /* 场景气泡：看电影的高兴 / 打比赛一局结束的胜负（–） */
  drawPartyHi(T);   /* –复盘的汗滴 + 无语 / 疑问气泡 */
  drawDongFx();drawSayFx(dt);   /* 像素「咚」+ say 的像素对话气泡（最顶层） */
  drawInvite(T);                /* –首领的邀请气泡（最顶层） */
}

/* ---- 三个场景本体的开演 ---- */
